[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tenant-fence"
version = "0.1.0"
description = "Permission-aware retrieval for multi-tenant RAG: entitlement is applied before the candidate set is scored, so cross-customer leakage is impossible by construction."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Vinicius Pereira" }]
keywords = [
    "multi-tenant rag",
    "permission-aware retrieval",
    "access control",
    "data segregation",
    "entitlement",
    "rag",
    "retrieval",
    "security",
]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Typing :: Typed",
]
dependencies = ["pydantic>=2"]

[project.urls]
Homepage = "https://github.com/vinimabreu/tenant-fence"
Source = "https://github.com/vinimabreu/tenant-fence"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[tool.hatch.build.targets.wheel]
packages = ["src/tenant_fence"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "examples", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RET", "PIE"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
files = ["src", "examples"]

[[tool.mypy.overrides]]
module = "examples.*"
disallow_untyped_defs = true
